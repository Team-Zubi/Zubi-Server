[project]
name = "zubi-server"
version = "0.1.0"
description = "Zubi backend API server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.163.1",
    "geoalchemy2>=0.17",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
